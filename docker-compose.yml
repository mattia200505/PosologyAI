
# ---------------------------------------------------------------------------
# Docker-compose de reference pour PosologyAI.
#
# Deux autres compose du depot (configuration/docker-compose.yml,
# docker-compose.scraper.yml) sont des versions partielles ou anciennes --
# l'une manque Neo4j, l'autre sert un service scraper distinct. Celui-ci est
# le seul a lancer exactement les trois magasins (MongoDB, Neo4j, Qdrant) +
# l'app Flask telle qu'elle tourne reellement (frontend_backend/app.py).
#
# Usage, depuis la racine du depot :
#   cp .env.example .env      # puis remplir les valeurs (voir README.md)
#   docker compose up --build
#
# Prealable obligatoire : SECRET_KEY doit exister dans .env, sinon l'app
# refuse de demarrer (voir config.py). La generer une fois :
#   python -c "import secrets; print('SECRET_KEY=' + secrets.token_hex(32))" >> .env
# ---------------------------------------------------------------------------

services:

  mongo:
    image: mongo:6
    container_name: posologyai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --bind_ip 0.0.0.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2025.10.1   # tag sans suffixe = edition Community, sans licence a accepter
    container_name: posologyai-neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"   # protocole bolt, utilise par l'app
      - "7474:7474"   # interface web Neo4j Browser
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD dans .env}"
      # L'edition Community ne gere qu'une seule base de donnees a la fois ;
      # on la nomme "medicament" pour matcher NEO4J_DATABASE (config.py),
      # plutot que d'en creer une seconde -- impossible sans Enterprise.
      NEO4J_initial_dbms_default__database: medicament
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: posologyai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: configuration/Dockerfile
    container_name: posologyai-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env   # fournit SECRET_KEY, MISTRAL_API_KEY, et tout le reste de la config locale
    environment:
      # Ces quatre-la ecrasent volontairement ce que .env peut contenir pour
      # un usage local (localhost) : en conteneur, chaque magasin est joint
      # par son nom de service, pas par localhost.
      FLASK_ENV: production
      MONGO_URI: mongodb://mongo:27017/medicsearch
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: medicsearch
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_DATABASE: medicament
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      default:

networks:
  default:
    name: posologyai-network

volumes:
  mongo_data:
  neo4j_data:
  qdrant_data:
