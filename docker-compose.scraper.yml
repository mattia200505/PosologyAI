version: '3.8'

services:
  # Existing services...
  
  # Medical Scraper API Service
  scraper_api:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: medicsearch_scraper_api
    ports:
      - "5001:5001"
    environment:
      - FLASK_APP=frontend_backend/scraper_api.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      
      # Database Configuration
      - MONGODB_URI=mongodb://mongo:27017/medicsearch
      - NEO4J_URI=neo4j://neo4j:7687
      
      # Scraper Configuration
      - SCRAPER_MAX_WORKERS=5
      - SCRAPER_TIMEOUT=300
      - SCRAPER_RATE_LIMIT=100
      - SCRAPER_USER_AGENT=MedicalScraper/1.0
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/var/log/medicsearch/scraper_api.log
      
    depends_on:
      - mongo
      - neo4j
      
    volumes:
      # Code volumes
      - ./scrapers:/app/scrapers
      - ./frontend_backend:/app/frontend_backend
      
      # Logging
      - ./logs:/var/log/medicsearch
      
    networks:
      - medicsearch_network
      
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/scraper/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: medicsearch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medicsearch_network
    command: redis-server --appendonly yes
    
  # Retool (optional - only if self-hosting)
  retool:
    image: retool/onpremise:latest
    container_name: medicsearch_retool
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=retool
      - POSTGRES_USER=retool
      - POSTGRES_PASSWORD=${RETOOL_DB_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      - medicsearch_network
    restart: on-failure
    
  # PostgreSQL for Retool
  postgres:
    image: postgres:15-alpine
    container_name: medicsearch_postgres
    environment:
      - POSTGRES_DB=retool
      - POSTGRES_USER=retool
      - POSTGRES_PASSWORD=${RETOOL_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medicsearch_network
    restart: on-failure

  # MongoDB (already exists, but here for reference)
  mongo:
    image: mongo:6
    container_name: medicsearch_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - medicsearch_network
    restart: on-failure

  # Neo4j (already exists, but here for reference)
  neo4j:
    image: neo4j:2025.10.1
    container_name: medicsearch_neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    networks:
      - medicsearch_network
    restart: on-failure

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: medicsearch_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - scraper_api
      - retool
    networks:
      - medicsearch_network
    restart: on-failure

volumes:
  mongo_data:
  neo4j_data:
  redis_data:
  postgres_data:

networks:
  medicsearch_network:
    driver: bridge

